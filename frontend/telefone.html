<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FedECG · Telefone</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    main { display: grid; place-items: center; padding: 16px; }
    .phone { width: min(100%, 360px); aspect-ratio: 9 / 18.5; background: var(--device); border: 3px solid var(--device-edge); border-radius: 44px; padding: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
    .screen { height: 100%; background: var(--screen); border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; }
    .status { display: flex; justify-content: space-between; padding: 12px 22px 6px; font: 500 0.75rem var(--mono); color: var(--muted); }
    .notch { width: 90px; height: 22px; background: var(--device); border-radius: 0 0 14px 14px; margin: -12px auto 0; }
    .app { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
    .app > * { flex: none; }
    .who { display: grid; gap: 2px; }
    .who b { font: 600 1.05rem var(--display); }
    .who span { font-size: 0.78rem; color: var(--muted); }
    .phase { background: var(--panel); border-radius: 14px; padding: 12px; display: grid; gap: 4px; }
    .phase .r { font: 500 0.72rem var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .phase .t { font: 600 1.1rem var(--display); color: var(--ecg); }
    .phase.alert { background: rgba(255, 99, 99, 0.12); }
    .phase.alert .t { color: var(--alert); }
    .card { background: var(--panel); border-radius: 14px; padding: 12px; display: grid; gap: 8px; font-size: 0.86rem; min-height: 96px; }
    .bar { display: grid; grid-template-columns: 4.2em 1fr 3.4em; gap: 8px; align-items: center; font-size: 0.8rem; }
    .bar .track { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
    .bar .fill { height: 100%; border-radius: 5px; transition: width .4s; }
    .bar .v { font-family: var(--mono); text-align: right; }
    .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 0.8rem; }
    .steps li { display: flex; gap: 8px; align-items: center; color: var(--muted); }
    .steps li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; }
    .steps li.done::before { background: var(--ecg); border-color: var(--ecg); }
    .steps li.now { color: var(--fg); font-weight: 600; }
    .steps li.now::before { border-color: var(--ecg); animation: pulse 0.8s infinite; background: var(--ecg); }
    .steps li.skip { text-decoration: line-through; opacity: 0.45; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .big { font: 600 1.6rem var(--mono); }
    .hist { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); }
    .hist b { color: var(--fg); font-size: 0.85rem; }
    .hist .a { color: var(--alert); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Fed<span>ECG</span> · Telemóvel</div>
    <div class="right">
      <label for="cli" class="muted">Cliente</label>
      <select id="cli"><option>A</option><option>B</option><option>C</option><option>D</option></select>
      <span id="conn" class="pill bad">a ligar…</span>
    </div>
  </div>
  <main>
    <div class="phone"><div class="screen">
      <div class="notch"></div>
      <div class="status"><span id="clock">--:--</span><span>FedECG</span></div>
      <div class="app">
        <div class="who"><b id="who">À espera do servidor</b><span id="whoSub">Inicia a simulação no ecrã do servidor.</span></div>
        <div class="phase" id="phase"><span class="r" id="round">ronda –</span><span class="t" id="phaseT">—</span></div>
        <div class="card" id="card"><span class="muted">Ainda sem dados.</span></div>
        <ul class="steps" id="steps"></ul>
        <div class="badges" id="badges"></div>
        <div class="hist" id="hist"></div>
      </div>
    </div></div>
  </main>
<script src="/static/common.js"></script>
<script src="/static/telefone.js"></script>
</body>
</html>
