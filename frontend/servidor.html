<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FedECG · Servidor</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .wrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
    .machine { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
    .machine svg { width: 100%; height: auto; }
    .led { transition: fill .2s; }
    .led.busy { animation: pulse 0.35s infinite; }
    .col { display: grid; gap: 16px; min-width: 0; }
    .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 0.88rem; }
    .controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .controls input[type="checkbox"] { accent-color: var(--ecg); width: 16px; height: 16px; }
    .controls input[type="range"] { accent-color: var(--noise); width: 100px; }
    .controls output { font-family: var(--mono); color: var(--noise); min-width: 3ch; }
    .controls .btns { margin-left: auto; display: flex; gap: 8px; }
    .grid2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
    table { width: 100%; border-collapse: collapse; font: 0.8rem var(--mono); font-variant-numeric: tabular-nums; }
    th, td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; font-family: var(--body); }
    th { color: var(--muted); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
    td.masked { color: var(--mask); } td.noisy { color: var(--noise); } td.raw { color: var(--fg); }
    tr.sum td { color: var(--ecg); border-top: 1px solid var(--muted); }
    .note { font-size: 0.78rem; color: var(--muted); margin: 6px 0 0; }
    .tbl { overflow-x: auto; }
    .term { background: var(--screen); border-radius: 8px; padding: 10px; font: 0.76rem/1.5 var(--mono); color: var(--muted); height: 180px; overflow-y: auto; }
    .term b { color: var(--ecg); font-weight: 500; }
    #chart { width: 100%; height: auto; }
    .axis { stroke: var(--line); }
    .axis-label { fill: var(--muted); font-size: 9px; font-family: var(--mono); }
    @media (max-width: 900px) { .wrap, .grid2 { grid-template-columns: minmax(0, 1fr); } }
      .recv { display: grid; gap: 6px; font-size: 0.82rem; }
    .recv ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    .recv li { display: flex; align-items: center; gap: 8px; }
    .recv li.c::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ecg); }
    .recv p { margin: 0; font-size: 0.76rem; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Fed<span>ECG</span> · Servidor de coordenação</div>
    <div class="right"><span class="muted mono" id="roundTxt">ronda –</span><span id="conn" class="pill bad">a ligar…</span></div>
  </div>
  <div class="wrap">
    <aside class="machine">
      <svg id="rack" viewBox="0 0 220 300" role="img" aria-label="Servidor"></svg>
      <div class="recv"><b>A receber informações de</b><ul id="from"><li class="muted">à espera de clientes…</li></ul><p class="muted">Só recebe contribuições protegidas; vê apenas o resultado agregado.</p></div>
    </aside>

    <div class="col">
      <form class="box controls" id="cfg">
        <label><input type="radio" name="mode" value="soft" checked> Soft labels</label>
        <label><input type="radio" name="mode" value="fedavg"> FedAvg</label>
        <label><input type="checkbox" id="ldp" checked> LDP</label>
        <label>ε <input type="range" id="eps" min="0.5" max="20" step="0.5" value="4"><output id="epsOut">4.0</output></label>
        <label><input type="checkbox" id="secagg" checked> Secure Aggregation</label>
        <label>Rondas <input type="number" id="rounds" min="1" max="50" value="3" style="width:4.5em"></label>
        <label>Ritmo <input type="range" id="speed" min="0.4" max="3" step="0.2" value="1.6"></label>
        <div class="btns"><button class="primary" id="start" type="submit">Iniciar</button><button type="button" id="stop">Parar</button></div>
      </form>

      <div class="grid2">
        <section class="box">
          <h2>Resultado agregado</h2>
          <p class="note" id="recvSub">Ainda sem dados.</p>
          <div class="tbl"><table id="tbl"></table></div>
          <p class="note" id="tblNote"></p>
        </section>
        <section class="box">
          <h2>PR-AUC (anomalia) por ronda</h2>
          <svg id="chart" viewBox="0 0 320 160" role="img" aria-label="PR-AUC médio por ronda"></svg>
          <p class="note" id="chartNote"></p>
        </section>
      </div>

      <section class="box">
        <h2 style="margin-bottom:8px">Consola</h2>
        <div class="term" id="term"></div>
      </section>
    </div>
  </div>
<script src="/static/common.js"></script>
<script src="/static/servidor.js"></script>
</body>
</html>
